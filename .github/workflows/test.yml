name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate i18n messages
        run: go run ./internal/i18n/cmd/check

      - name: Scan i18n key references
        run: go run ./internal/i18n/cmd/check --scan-code

      - name: Test Feishu shortcuts
        run: go test ./shortcuts/feishu

      - name: Test workflow shortcuts
        run: go test ./shortcuts/workflow

      - name: Test Enterprise WeChat adapter
        run: go test ./shortcuts/wecom

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Enterprise WeChat long-connection bridge contracts
        run: node --test bridges/wecom/test/*.test.mjs

      - name: Run Go tests
        run: go test ./...

      - name: Vet
        run: go vet ./...
